server.port=8888
spring.profiles.active=local
server.servlet.context-path=/watcher
spring.application.name=watcher-agent
watcher.home=/var
#循环依赖
spring.main.allow-circular-references=true

#=============== admin 配置  =======================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ================================================
# 中间件开关 - MySQL 单机版全部禁用
# ================================================
elasticsearch.enable=false
kafka.enable=false
mongodb.enable=false
clickhouse.enable=false
quartz.enable=false

# ================================================
# 插件模块开关 - MySQL 单机版禁用
# ================================================
rest-client.cas.enable=false
rest-client.uis.enable=false
rest-client.ws.enable=false
rest-client.onestor.enable=false

# CAS 配置（占位符，防止启动失败）
cas.http.port=8080
cas.https.port=8443
cas.username=admin
cas.password=admin

# UIS 配置
vdi.uis.admin.username=admin
vdi.uis.admin.password=admin
vdi.provider.operator.port=6060

# Workspace 配置
vdi.ws.admin.username=root
vdi.ws.admin.password=root@123

# ================================================
# MySQL 数据源配置
# ================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/watcher_db?useUnicode=true&characterEncoding=utf8&connectTimeout=60000
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.virtual.cloud.om.sdk.entity.mysql
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.mapper扫描=com.virtual.cloud.om.sdk.mapper

# ================================================
# 插件服务配置（根据实际情况修改）
# ================================================
# CAS 服务地址
cas.service.url=http://localhost:8080/cas
# UIS 服务地址
uis.service.url=http://localhost:8081/uis
# Workspace 服务地址
ws.service.url=http://localhost:8082/workspace
# =========================== workspace ========================================
vdi.ws.admin.username=root
vdi.ws.admin.password=root@123
# 存放批量采集日志文件的文件夹名
batch.collect.log.dir.name=collectFiles

# 系统配置
who.are.you=watcher
