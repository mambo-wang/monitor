# ================================================
# ShowTime MySQL 单机版配置
# ================================================

# 服务端口
server.port=8888
server.servlet.context-path=/watcher
spring.application.name=watcher-agent

# 循环依赖允许
spring.main.allow-circular-references=true

# ================================================
# 中间件开关 - 全部禁用
# ================================================
elasticsearch.enable=false
kafka.enable=false
mongodb.enable=false
clickhouse.enable=false
quartz.enable=false

# ================================================
# 插件模块开关
# ================================================
rest-client.cas.enable=true
rest-client.uis.enable=true
rest-client.ws.enable=true

# ================================================
# MySQL 数据源配置
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/watcher_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.virtual.cloud.om.sdk.entity.mysql
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# ================================================
# 插件服务配置（根据实际情况修改）
# ================================================
# CAS 服务地址
cas.service.url=http://localhost:8080/cas
# UIS 服务地址
uis.service.url=http://localhost:8081/uis
# Workspace 服务地址
ws.service.url=http://localhost:8082/workspace

# ================================================
# Admin 配置
# ================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
